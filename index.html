<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Production API. On localhost use same-origin proxy (scripts/dev-server.py).
      // On self-hosted scorix.ru — same origin (/api via nginx).
      (function () {
        var host = location.hostname;
        var local =
          host === "localhost" || host === "127.0.0.1" || host === "[::1]";
        var selfHosted =
          host === "scorix.ru" ||
          host.endsWith(".scorix.ru");
        window.SCORIX_API_BASE =
          local || selfHosted
            ? location.origin
            : "https://callmate-api.onrender.com";
      })();
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
