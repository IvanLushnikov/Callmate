<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // API base: same origin by default. Override with window.SCORIX_API_BASE before this
      // script if the cabinet is hosted separately from the API (set CORS origins on the API).
      // No hardcoded third-party Pages → prod API mapping.
      (function () {
        if (window.SCORIX_API_BASE) return;
        window.SCORIX_API_BASE = location.origin;
      })();
    </script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
